name: github-trending-radar

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect & Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # 可选；不配置则走代码规则摘要
        run: python run.py

      - name: Commit history & reports
        run: |
          git config user.name "github-trending-radar[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json output/
          git commit -m "chore: daily update $(date +%F)" || echo "no changes"
          git push

      - name: Copy to server
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "output/."
          target: "${{ secrets.DEPLOY_DIR }}"

      - name: Reload Caddy
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "caddy reload || sudo caddy reload || true"
