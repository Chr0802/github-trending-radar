name: github-trending-radar

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect & Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 二选一，都不配则走代码规则摘要（不依赖任何 LLM）
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # 免费模型，推荐
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}                # DeepSeek 等自有 key
          # 可留空由 config.yaml 的 auto 自动探测；也可强制指定 deepseek / openrouter
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: python run.py

      - name: Commit history & reports
        run: |
          git config user.name "github-trending-radar[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json output/
          git commit -m "chore: daily update $(date +%F)" || echo "no changes"
          git push

      # 部署方式：实例主动拉取（不需 SSH）。
      # Action 只负责把报告 push 到公开仓库；实例上的 cron 定时 git pull 到
      # /var/www/trending，由 Caddy :8080 直接服务。参见 README「实例拉取」。
