name: github-trending-radar-collect

# 只做采集：Action 网络好（美国），负责 OSS Insight / GitHub Search / README。
# 摘要、生成、展示由实例上的 cron 完成（见 deploy/instance-run.sh）。
on:
  # 不依赖 GitHub schedule（不可靠），由实例 cron 每天 5:55 触发 workflow_dispatch
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect candidates only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u run.py --collect-only

      - name: Commit candidates
        run: |
          git config user.name "github-trending-radar[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/candidates.json
          git commit -m "chore: candidates $(date +%F)" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push 失败，第 $i 次重试"; sleep 5
          done

      # 说明：本 workflow 不跑 LLM、不生成 HTML、不部署。
      # 实例侧每 2 分钟检查 data/candidates.json 是否有更新，有则生成并写入 Caddy 根目录。
